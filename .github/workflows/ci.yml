name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    name: Build opencv toolkit against paperboat
    runs-on: ubuntu-24.04
    steps:
      # The engine is public: no token, so this always builds (a skipped build showed green).
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat
          ref: dev
          path: paperboat
      - name: Overlay the toolkit
        run: cp -r engine/toolkit/opencv paperboat/engine/toolkit/opencv
      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopencv-dev ninja-build
      - name: Configure
        run: cmake -S paperboat/engine -B paperboat/engine/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build paperboat/engine/build

      - name: Check the examples are discovered
        run: |
          cp -r examples paperboat/engine/toolkit/opencv/
          cd paperboat
          ./bin/paperboat backends | grep ocv-01-parts-counter
          ./bin/paperboat check --fast engine/toolkit/opencv/examples/ocv-01-parts-counter

  validate:
    name: Validate toolkit files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check toolkit.toml parses
        run: python3 -c "import tomllib; tomllib.load(open('engine/toolkit/opencv/toolkit.toml','rb')); print('toolkit.toml OK')"
      - name: Check OpenCV headers present
        run: test -f engine/toolkit/opencv/include/paperboat/toolkit/opencv.hpp && echo OK

  # The path a user takes (paperboatlab/paperboat#354): paperboat installed as a release (shared engine and
  # SDK), then `paperboat toolkit install` builds this toolkit as a plugin against it. No engine checkout.
  plugin:
    name: Install as a plugin on an installed paperboat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat
          ref: dev
          path: paperboat
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake g++ git libopencv-dev
      - name: paperboat, installed as a release would be
        run: |
          cmake -S paperboat/engine -B "$RUNNER_TEMP/pb-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DPAPERBOAT_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/pb-build"
          cmake --install "$RUNNER_TEMP/pb-build" --prefix "$RUNNER_TEMP/pb"
      - name: paperboat toolkit install opencv, from this checkout
        env:
          PAPERBOAT_HOME: ${{ runner.temp }}/home
        run: |
          cd "$RUNNER_TEMP"   # outside any checkout: the installed paperboat, as a user has it
          "$RUNNER_TEMP/pb/bin/paperboat" toolkit install opencv --path "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/pb/bin/paperboat" toolkit list opencv | grep -q "opencv/"
          python3 -m pip install -q --user --break-system-packages websockets jsonschema
          "$RUNNER_TEMP/pb/bin/paperboat" check ocv-01   # its example, built against the SDK and this plugin
